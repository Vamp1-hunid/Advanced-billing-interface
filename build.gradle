plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'zm.ac.mu.ict261'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    // Compile with whichever JDK is running Gradle (e.g. JDK 25) instead of
    // requiring a separate JDK 21 installation, but still target Java 21
    // bytecode so the project stays compatible with Java 21.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

javafx {
    version = '21.0.5'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'lodgebilling.LodgeBillingApp'
}
